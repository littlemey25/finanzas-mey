<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mey · Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#14181D;
  --panel:#1B2028;
  --panel-2:#20262F;
  --line:rgba(255,255,255,0.08);
  --text:#E9EBEF;
  --muted:#8A93A3;
  --slate:#3E6E8E;
  --slate-light:#5C8EAE;
  --plum:#8B4E8F;
  --plum-light:#AA6FAE;
  --green:#4FA579;
  --red:#D9707A;
  --amber:#D3A24C;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wordmark{
  font-family:'Cormorant',serif;
  font-weight:600;
  font-style:normal;
  letter-spacing:0.02em;
}
.app{max-width:920px;margin:0 auto;padding:20px 16px 90px;}
@media(min-width:1300px){ .app{max-width:1240px;} }
.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.topbar .wordmark{font-size:30px;color:var(--text);}
.topbar .wordmark span{color:var(--slate-light);}
.topbar .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;}
.topbar .conn{font-size:11.5px;color:var(--muted);display:flex;align-items:center;}

nav.tabs{
  display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:5px;margin-bottom:20px;position:sticky;top:10px;z-index:20;
  backdrop-filter:blur(8px);
}
nav.tabs button{
  flex:1;background:transparent;border:none;color:var(--muted);
  font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;
  padding:10px 4px;border-radius:10px;cursor:pointer;transition:background .15s, color .15s;
}
nav.tabs button.active{background:linear-gradient(135deg, var(--slate), var(--plum));color:#fff;}
nav.tabs button:not(.active):hover{color:var(--text);}

.view{display:none;}
.view.active{display:block;}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:14px;margin:0;color:var(--muted);font-weight:700;text-transform:none;letter-spacing:.01em;}

.btn{
  font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  padding:9px 14px;border-radius:999px;cursor:pointer;transition:transform .1s, border-color .15s;
}
.btn:hover{border-color:var(--slate-light);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg, var(--slate), var(--plum));border:none;color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--line);}
.btn-sm{padding:6px 11px;font-size:11.5px;}
.btn-danger{color:var(--red);}

.block{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.debt-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.responsive-grid{display:block;}
@media(min-width:900px){
  .responsive-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .responsive-grid > .block, .responsive-grid > .debt-card{margin-bottom:0;}
}
@media(min-width:1300px){
  .card-grid{grid-template-columns:repeat(3,1fr);}
  #tasa0Grid.responsive-grid, #porCobrarList.responsive-grid{grid-template-columns:1fr 1fr 1fr;}
}
.block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.block-head .label{font-weight:800;font-size:14px;}
.block-head .sub{font-size:11px;color:var(--muted);font-weight:600;}
.block-total{font-size:12px;color:var(--muted);}

.row-item{
  display:flex;align-items:center;gap:10px;padding:10px 2px;
  border-bottom:1px solid var(--line);
}
.row-item.dragging{opacity:0.4;}
.row-item.drag-over{border-top:2px solid var(--slate-light);}
.drag-handle{color:var(--muted);cursor:grab;flex:none;font-size:14px;user-select:none;}
.drag-handle:active{cursor:grabbing;}
.row-item:last-child{border-bottom:none;}
.row-item input[type=checkbox]{
  width:19px;height:19px;accent-color:var(--green);flex:none;cursor:pointer;
}
.row-item .info{flex:1;min-width:0;}
.row-item .name{font-weight:600;font-size:13.5px;}
.row-item .tag{font-size:10.5px;color:var(--muted);margin-top:2px;}
.row-item.paid .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
.row-item .amount{font-weight:700;font-size:13.5px;white-space:nowrap;}
.row-item .amount.fijo{color:var(--slate-light);}
.row-item .amount.variable{color:var(--text);}
.row-item .del{color:var(--muted);background:none;border:none;cursor:pointer;font-size:15px;padding:2px 4px;}
.row-item .del:hover{color:var(--red);}

.empty{color:var(--muted);font-size:12.5px;padding:16px 4px;text-align:center;}

.link-tag{
  font-size:10px;background:rgba(62,110,142,0.18);color:var(--slate-light);
  padding:2px 7px;border-radius:999px;margin-left:6px;
}

.history-toggle{
  display:block;width:100%;text-align:center;color:var(--muted);font-size:12px;
  background:none;border:1px dashed var(--line);border-radius:12px;padding:10px;

}
.mes-nav{display:flex;align-items:center;gap:10px;margin:4px 0 16px;}
.mes-nav .mes-label{flex:1;text-align:center;font-weight:800;font-size:15px;}
.mes-nav #btnMesHoy{margin-left:4px;}
.icon-btn-sm{color:var(--muted);background:none;border:none;cursor:pointer;font-size:13px;padding:2px 5px;flex:none;}
.icon-btn-sm:hover{color:var(--text);}

/* --- Tarjetas --- */
.resumen-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.resumen-item{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:11px;color:var(--muted);}

.card-grid{display:grid;grid-template-columns:1fr;gap:14px;}

}
.credit-card.visa{background:linear-gradient(135deg,#2E5C78,#3E6E8E 55%,#5C8EAE);}
.credit-card.amex{background:linear-gradient(135deg,#6B3B70,#8B4E8F 55%,#AA6FAE);}

.credit-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;font-size:11px;opacity:.85;}
.credit-card .balance{font-size:22px;font-weight:800;letter-spacing:.01em;}

.card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.badge-sync{font-size:10px;color:var(--amber);margin-top:6px;}

/* --- Tasa 0 --- */

.progress-fill{height:100%;background:linear-gradient(90deg,var(--slate),var(--plum));}
.debt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.debt-name{font-weight:800;font-size:15px;}
.icon-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:13px;flex:none;}
.icon-btn:hover{color:var(--text);border-color:var(--slate-light);}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.badge{font-size:11px;background:rgba(139,78,143,0.18);color:var(--plum-light);padding:4px 10px;border-radius:999px;font-weight:700;white-space:nowrap;}
.stats-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:2px;gap:8px;}
.stats-row b{display:block;font-size:14px;color:var(--text);font-weight:800;margin-top:2px;}
.cuotas-table-wrap{max-height:190px;overflow-y:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;}
.cuotas-table{width:100%;border-collapse:collapse;font-size:12px;}
.cuotas-table th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px;text-align:left;}

.cuotas-table td:nth-child(4),.cuotas-table td:nth-child(5),.cuotas-table th:nth-child(4),.cuotas-table th:nth-child(5){text-align:center;}
.cuotas-table input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);}
.cuotas-table tr.done td{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
.cuotas-table tr.done input{opacity:.55;}

/* --- Por Cobrar --- */
.persona-name{font-family:'Cormorant',serif;font-weight:600;font-size:19px;}
.persona-row{cursor:pointer;transition:border-color .15s;}
.persona-row:hover{border-color:var(--slate-light);}
.abono-details{margin-top:10px;}
.abono-details summary{
  cursor:pointer;font-size:11.5px;color:var(--slate-light);font-weight:700;
  list-style:none;padding:6px 0;user-select:none;
}
.abono-details summary::-webkit-details-marker{display:none;}
.abono-details summary::before{content:'▸ ';display:inline-block;transition:transform .15s;}
.abono-details[open] summary::before{transform:rotate(90deg);}
.abono-details .abono-list{margin-top:4px;max-height:180px;overflow-y:auto;}

/* --- Modal --- */
.modal-bg{
  position:fixed;inset:0;background:rgba(10,12,15,0.72);display:none;
  align-items:flex-end;justify-content:center;z-index:100;
}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal{
  background:var(--panel);border:1px solid var(--line);width:100%;max-width:440px;
  border-radius:20px 20px 0 0;padding:22px;max-height:88vh;overflow-y:auto;
}
@media(min-width:640px){.modal{border-radius:18px;}}
.modal h3{margin:0 0 14px;font-size:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.field input,.field select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);padding:10px 12px;font-family:'Manrope',sans-serif;font-size:13.5px;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--slate-light);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--red);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:12.5px;font-weight:700;z-index:200;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.toast.ok{background:var(--green);}

.setup-gate{max-width:480px;margin:60px auto;text-align:center;padding:0 20px;}
.setup-gate p{color:var(--muted);font-size:13px;line-height:1.6;}
.setup-gate code{background:var(--panel-2);padding:2px 6px;border-radius:6px;font-size:12px;}
</style>

<script>
/* =========================================================
   CONFIGURACIÓN — reemplaza estos dos valores con los de tu
   proyecto Supabase (Project Settings → API).
   ========================================================= */
const SUPABASE_URL = 'https://qdfsyxsfjqfvyuiixllp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_UMkxDontjmeSHAIIAhDwZQ__QPVUokG';
</script>
<script>
/* =========================================================
   Mey · Finanzas — lógica de aplicación
   ========================================================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = {
  cards: [], cardAbonos: [],
  deudas: [], tasa0Pagos: [],
  rubros: [], rubrosFijos: [],
  porCobrar: [], porCobrarAbonos: [], porCobrarPersona: null,
  viewYear: new Date().getFullYear(), viewMonth: new Date().getMonth(), // navegación de mes en Quincenas
};

/* ---------- helpers de formato ---------- */
const fmt = n => (Number(n) || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const colones = n => `₡${fmt(n)}`;
const uid = () => crypto.randomUUID();
// Evita que la acumulación de errores de punto flotante (ej. 465576.9866666...)
// termine bloqueando el input nativo (step="0.01") o desalineando los centavos.
const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;

// Signo de un ABONO (pago recibido/aplicado) según el tipo de cuenta:
// crédito -> resta (baja la deuda); débito -> suma (entra dinero).
function accountSign(tipoCuenta){ return tipoCuenta === 'debito' ? 1 : -1; }
// Signo de un CARGO (se crea la deuda / sale dinero prestado) — es el inverso del abono.
function cargoSign(tipoCuenta){ return tipoCuenta === 'debito' ? -1 : 1; }

function toast(msg, ok=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (ok ? ' ok' : '');
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.style.display = 'none'; }, 3200);
}

/* ---------- helpers de quincena ----------
   Etiqueta = fecha ISO real: día 15 del mes (primera mitad) o
   último día calendario del mes (segunda mitad). Esto evita el
   problema de columnas "30/7" en meses con 31 días. */
function lastDayOfMonth(year, monthIndex){
  return new Date(year, monthIndex + 1, 0).getDate();
}
function iso(y,m,d){
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function quincenaOf(date){
  const y = date.getFullYear(), m = date.getMonth(), day = date.getDate();
  if (day <= 15) return iso(y,m,15);
  return iso(y,m, lastDayOfMonth(y,m));
}
function nextQuincena(label){
  const [y,m,d] = label.split('-').map(Number);
  if (d === 15) return iso(y, m-1, lastDayOfMonth(y, m-1));
  // era el último día del mes -> el 15 del mes siguiente
  const nm = m === 12 ? 1 : m+1, ny = m === 12 ? y+1 : y;
  return iso(ny, nm-1, 15);
}
function prevQuincena(label){
  const [y,m,d] = label.split('-').map(Number);
  if (d !== 15) return iso(y, m-1, 15);
  const pm = m === 1 ? 12 : m-1, py = m === 1 ? y-1 : y;
  return iso(py, pm-1, lastDayOfMonth(py, pm-1));
}
function labelDisplay(label){
  const [y,m,d] = label.split('-').map(Number);
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d} ${meses[m-1]} ${String(y).slice(2)}`;
}
function addMonths(label, n){
  // label es 'YYYY-MM-DD' de un día de cobro (dia_cobro)
  const [y,m,d] = label.split('-').map(Number);
  const total = (m-1) + n;
  const ny = y + Math.floor(total/12), nm = (total%12)+1;
  const clampDay = Math.min(d, lastDayOfMonth(ny, nm-1));
  return iso(ny, nm-1, clampDay);
}
function quincenasOfMonth(year, monthIndex){
  return [iso(year, monthIndex, 15), iso(year, monthIndex, lastDayOfMonth(year, monthIndex))];
}
function quincenaHalf(label){
  const d = Number(label.split('-')[2]);
  return d === 15 ? 'primera' : 'segunda';
}
function mesNombre(year, monthIndex){
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${meses[monthIndex]} ${year}`;
}
function pendientesAnteriores(){
  const current = quincenaOf(new Date());
  return [...new Set(state.rubros.filter(r=>!r.pagado).map(r=>r.quincena_label))]
    .filter(l => l < current).sort();
}
function nextOrdenFor(label){
  const existing = state.rubros.filter(r=>r.quincena_label===label).map(r=> r.orden ?? -1);
  return existing.length ? Math.max(...existing)+1 : 0;
}

/* ---------- rubros fijos recurrentes ----------
   Cada plantilla activa debe tener una instancia generada en `rubros`
   para toda quincena entre la última generada y la próxima (inclusive).
   Editar el monto/nombre de la plantilla solo afecta lo que se genere
   de aquí en adelante; lo ya generado no se toca retroactivamente. */
async function ensureRecurringGenerated(){
  const current = quincenaOf(new Date());
  const next = nextQuincena(current);
  for (const tpl of state.rubrosFijos.filter(t=>t.activo)){
    let cursor = tpl.last_generated_label ? nextQuincena(tpl.last_generated_label) : current;
    let lastLabel = tpl.last_generated_label;
    const nuevos = [];
    let guard = 0;
    while (guard++ < 60){
      const yaExiste = state.rubros.some(r=> r.fijo_id===tpl.id && r.quincena_label===cursor);
      const aplica = !tpl.aplica_a || tpl.aplica_a==='ambas' || quincenaHalf(cursor)===tpl.aplica_a;
      if (!yaExiste && aplica){
        nuevos.push({ nombre: tpl.nombre, monto: tpl.monto, tipo:'fijo', quincena_label: cursor, link_type: tpl.link_type, link_id: tpl.link_id, fijo_id: tpl.id, orden: nextOrdenFor(cursor) });
      }
      lastLabel = cursor;
      if (cursor === next) break;
      cursor = nextQuincena(cursor);
    }
    if (nuevos.length>0) await sb.from('rubros').insert(nuevos);
    if (lastLabel !== tpl.last_generated_label) await sb.from('rubros_fijos').update({last_generated_label: lastLabel}).eq('id', tpl.id);
  }
}

/* ---------- carga de datos ---------- */
async function loadAll(){
  try{
    const [cards, cardAbonos, deudas, tasa0Pagos, rubros, rubrosFijos, porCobrar, porCobrarAbonos] = await Promise.all([
      sb.from('cards').select('*').order('orden'),
      sb.from('card_abonos').select('*').order('fecha', {ascending:false}),
      sb.from('deudas_tasa0').select('*').order('created_at'),
      sb.from('tasa0_pagos').select('*'),
      sb.from('rubros').select('*').order('quincena_label'),
      sb.from('rubros_fijos').select('*'),
      sb.from('por_cobrar').select('*').order('created_at'),
      sb.from('por_cobrar_abonos').select('*'),
    ]);
    for (const r of [cards, cardAbonos, deudas, tasa0Pagos, rubros, rubrosFijos, porCobrar, porCobrarAbonos]){
      if (r.error) throw r.error;
    }
    state.cards = cards.data; state.cardAbonos = cardAbonos.data;
    state.deudas = deudas.data; state.tasa0Pagos = tasa0Pagos.data;
    state.rubros = rubros.data; state.rubrosFijos = rubrosFijos.data;
    state.porCobrar = porCobrar.data; state.porCobrarAbonos = porCobrarAbonos.data;

    await ensureRecurringGenerated();
    const [rubrosFresh, fijosFresh] = await Promise.all([
      sb.from('rubros').select('*').order('quincena_label'),
      sb.from('rubros_fijos').select('*'),
    ]);
    state.rubros = rubrosFresh.data; state.rubrosFijos = fijosFresh.data;

    setConn(true);
    renderAll();
  }catch(err){
    console.error(err);
    setConn(false);
    toast('No se pudo conectar a la base de datos. Revisa SUPABASE_URL y SUPABASE_ANON_KEY.');
  }
}
function setConn(ok){
  document.getElementById('connDot').style.background = ok ? 'var(--green)' : 'var(--red)';
  document.getElementById('connLabel').textContent = ok ? 'sincronizado' : 'sin conexión';
}
function renderAll(){
  renderQuincenas();
  renderTarjetas();
  renderTasa0();
  renderPorCobrar();
}

/* =========================================================
   QUINCENAS
   ========================================================= */
function renderQuincenas(){
  const today = new Date();
  const current = quincenaOf(today);
  const next = nextQuincena(current);

  // Pendientes de meses anteriores: siempre visibles, sin importar el mes que se navegue.
  const pendLabels = pendientesAnteriores();
  const wrap = document.getElementById('pendientesAnterioresWrap');
  const pendBox = document.getElementById('quincenasPendientesAnteriores');
  pendBox.innerHTML = '';
  if (pendLabels.length===0){
    wrap.style.display = 'none';
  } else {
    wrap.style.display = '';
    pendLabels.forEach(label=> pendBox.appendChild(renderQuincenaBlock(label, current, next)));
  }

  // Mes navegado: siempre sus dos quincenas, sin filtrar por estado de pago.
  document.getElementById('mesLabel').textContent = mesNombre(state.viewYear, state.viewMonth);
  const [q1, q2] = quincenasOfMonth(state.viewYear, state.viewMonth);
  const box = document.getElementById('quincenasBlocks');
  box.innerHTML = '';
  [q1, q2].forEach(label=> box.appendChild(renderQuincenaBlock(label, current, next)));
}

function tagFor(label, current, next){
  if (label === current) return 'quincena actual';
  if (label === next) return 'próxima';
  return label < current ? 'quincena pasada' : 'quincena futura';
}

const dragState = { id: null };
async function reorderRubros(label, draggedId, targetId){
  const items = state.rubros.filter(r=>r.quincena_label===label)
    .sort((a,b)=> ((a.orden??9999)-(b.orden??9999)) || a.nombre.localeCompare(b.nombre));
  const fromIdx = items.findIndex(r=>r.id===draggedId);
  const toIdx = items.findIndex(r=>r.id===targetId);
  if (fromIdx===-1 || toIdx===-1) return;
  const [moved] = items.splice(fromIdx, 1);
  items.splice(toIdx, 0, moved);

  // Aplica el mismo orden a esta quincena y, por nombre, a las demás quincenas
  // que tengan un rubro igual (así no hay que reordenar una por una).
  const updates = [];
  items.forEach((r, idx)=>{
    updates.push(sb.from('rubros').update({orden: idx}).eq('id', r.id));
    state.rubros
      .filter(other => other.quincena_label !== label && other.nombre === r.nombre)
      .forEach(other => updates.push(sb.from('rubros').update({orden: idx}).eq('id', other.id)));
  });
  await Promise.all(updates);
  await loadAll();
}

function renderQuincenaBlock(label, current, next){
  const items = state.rubros.filter(r=>r.quincena_label===label);
  const total = items.reduce((s,r)=> s + (r.tipo==='ingreso' ? -Number(r.monto) : Number(r.monto)), 0);
  const tagText = tagFor(label, current, next);

  const el = document.createElement('div');
  el.className = 'block';
  el.innerHTML = `
    <div class="block-head">
      <div><div class="label">${labelDisplay(label)}</div><div class="sub">${tagText}</div></div>
      <div class="block-total">${colones(total)}</div>
    </div>
    <div class="items"></div>
    <button class="btn btn-sm btn-ghost" data-addrubro="${label}" style="margin-top:6px;width:100%;">+ Rubro</button>
  `;
  const itemsBox = el.querySelector('.items');
  if (items.length===0){
    itemsBox.innerHTML = '<div class="empty">Sin rubros todavía.</div>';
  }
  items.sort((a,b)=> ((a.orden??9999)-(b.orden??9999)) || a.nombre.localeCompare(b.nombre));
  items.forEach(r=>{
    const cardVinc = r.link_type==='card' ? state.cards.find(c=>c.id===r.link_id) : null;
    const deudaVinc = r.link_type==='tasa0' ? state.deudas.find(d=>d.id===r.link_id) : null;
    const cardDeDeuda = deudaVinc && deudaVinc.card_id ? state.cards.find(c=>c.id===deudaVinc.card_id) : null;
    const linkTxt = r.link_type==='card' ? `💳 ${cardVinc ? cardVinc.nombre : 'tarjeta'}`
                  : r.link_type==='tasa0' ? `✓ tasa 0${cardDeDeuda?` · 💳 ${cardDeDeuda.nombre}`:''}`
                  : r.link_type==='porcobrar' ? '↩ por cobrar' : '';
    const esIngreso = r.tipo==='ingreso';
    const puedeEditar = r.link_type !== 'tasa0' && r.link_type !== 'porcobrar';
    const row = document.createElement('div');
    row.className = 'row-item' + (r.pagado ? ' paid' : '');
    row.draggable = true;
    row.dataset.rubroId = r.id;
    row.innerHTML = `
      <span class="drag-handle" title="Arrastrar para reordenar">⠿</span>
      <input type="checkbox" ${r.pagado?'checked':''} data-toggle="${r.id}">
      <div class="info">
        <div class="name">${r.nombre}${r.fijo_id?' <span title="Recurrente">🔁</span>':''}${linkTxt?`<span class="link-tag">${linkTxt}</span>`:''}</div>
        <div class="tag">${esIngreso?'Ingreso':r.tipo==='fijo'?'Fijo':'Variable'}</div>
      </div>
      <div class="amount ${r.tipo}" ${esIngreso?'style="color:var(--green)"':''}>${esIngreso?'+':''}${colones(r.monto)}</div>
      ${puedeEditar?`<button class="icon-btn-sm" data-editrubro="${r.id}" title="Editar">✎</button>`:''}
      <button class="del" data-delrubro="${r.id}">×</button>
    `;
    itemsBox.appendChild(row);
  });

  // Arrastrar y soltar para reordenar manualmente dentro de esta quincena.
  itemsBox.querySelectorAll('.row-item').forEach(rowEl=>{
    rowEl.addEventListener('dragstart', ()=>{
      dragState.id = rowEl.dataset.rubroId;
      rowEl.classList.add('dragging');
    });
    rowEl.addEventListener('dragend', ()=> rowEl.classList.remove('dragging'));
    rowEl.addEventListener('dragover', e=>{ e.preventDefault(); rowEl.classList.add('drag-over'); });
    rowEl.addEventListener('dragleave', ()=> rowEl.classList.remove('drag-over'));
    rowEl.addEventListener('drop', async e=>{
      e.preventDefault();
      rowEl.classList.remove('drag-over');
      const targetId = rowEl.dataset.rubroId;
      if (!dragState.id || dragState.id===targetId) return;
      await reorderRubros(label, dragState.id, targetId);
      dragState.id = null;
    });
  });

  el.querySelectorAll('[data-toggle]').forEach(cb=>{
    cb.onchange = ()=> toggleRubro(cb.dataset.toggle, cb.checked, label);
  });
  el.querySelectorAll('[data-editrubro]').forEach(b=>{
    b.onclick = ()=> openEditRubroModal(b.dataset.editrubro);
  });
  el.querySelectorAll('[data-delrubro]').forEach(b=>{
    b.onclick = async ()=>{
      const { error } = await sb.from('rubros').delete().eq('id', b.dataset.delrubro);
      if (error) return toast('No se pudo eliminar.');
      await loadAll();
    };
  });
  el.querySelector('[data-addrubro]').onclick = ()=> openRubroModal(label);
  return el;
}

async function toggleRubro(id, checked, label){
  const rubro = state.rubros.find(r=>r.id===id);
  if (!rubro) return;
  const { error } = await sb.from('rubros').update({pagado:checked}).eq('id', id);
  if (error) return toast('No se pudo actualizar.');

  const fuente = state.cards.find(c=>c.tipo_cuenta==='debito' && c.es_fuente_pagos);
  if (!fuente){
    toast('⚠ Ninguna tarjeta de débito está marcada como "fuente de pagos". BAC no se ajustará hasta que edites esa tarjeta y actives esa opción.');
  }
  const origenTag = `quincena:${label}:${rubro.id}`;

  if (rubro.link_type === 'card' && rubro.link_id){
    // Vinculado explícitamente a una tarjeta de CRÉDITO: marcarlo pagado siempre significa
    // "estoy abonando/pagando esa tarjeta" (baja la deuda) Y, por cascada dentro de
    // applyCardDelta, baja también BAC (de ahí salió físicamente el dinero).
    const linkedCard = state.cards.find(c=>c.id===rubro.link_id);
    const kind = (linkedCard && linkedCard.tipo_cuenta === 'debito')
      ? (rubro.tipo === 'ingreso' ? 'abono' : 'gasto')
      : 'abono';
    await applyCardDelta(rubro.link_id, rubro.monto, checked, origenTag, kind);
  }
  else if (rubro.link_type === 'tasa0' && rubro.link_id){
    await sb.from('tasa0_pagos').update({pagado: checked}).eq('deuda_id', rubro.link_id).eq('quincena_label', label);
    const deuda = state.deudas.find(d=>d.id===rubro.link_id);
    if (deuda && deuda.card_id){
      await applyCardDelta(deuda.card_id, rubro.monto, checked, origenTag, 'abono');
    } else if (fuente){
      // Tasa 0 sin tarjeta de crédito asociada: la cuota sale directo de la cuenta de dinero.
      await applyCardDelta(fuente.id, rubro.monto, checked, origenTag, 'gasto');
    }
  }
  else if (rubro.link_type === 'porcobrar' && rubro.link_id){
    if (checked){
      await sb.from('por_cobrar_abonos').insert({cobrar_id: rubro.link_id, monto: Number(rubro.monto), fecha: new Date().toISOString().slice(0,10), origen: origenTag});
    } else {
      await sb.from('por_cobrar_abonos').delete().eq('cobrar_id', rubro.link_id).eq('origen', origenTag);
    }
    const prestamo = state.porCobrar.find(p=>p.id===rubro.link_id);
    if (prestamo && prestamo.card_id){
      await applyCardDelta(prestamo.card_id, rubro.monto, checked, origenTag, 'abono');
    } else if (fuente){
      await applyCardDelta(fuente.id, rubro.monto, checked, origenTag, 'abono');
    }
  }
  else {
    // Sin vínculo explícito: por defecto, sale de (o entra a) la cuenta marcada como
    // fuente de pagos — no hace falta vincular manualmente los gastos normales a BAC.
    if (fuente){
      const kind = rubro.tipo === 'ingreso' ? 'abono' : 'gasto';
      await applyCardDelta(fuente.id, rubro.monto, checked, origenTag, kind);
    }
  }
  await loadAll();
}

// Aplica (o revierte) un movimiento sobre el saldo_actual de una tarjeta y registra/quita el movimiento.
// kind: 'abono' (dinero entra o baja la deuda) | 'gasto' (dinero sale o sube la deuda).
// El sentido final también depende de si la cuenta es de crédito o de débito.
async function applyCardDelta(cardId, monto, checked, origen, kind='abono', fecha=null, concepto=null){
  const card = state.cards.find(c=>c.id===cardId);
  if (!card){
    toast('Este rubro está vinculado a una tarjeta que ya no existe — el saldo no se ajustó. Edítalo (✎) para volver a vincularlo.');
    return;
  }
  const hoy = fecha || new Date().toISOString().slice(0,10);
  const sign = kind==='gasto' ? cargoSign(card.tipo_cuenta) : accountSign(card.tipo_cuenta);
  const delta = (checked ? 1 : -1) * sign * Number(monto);
  const nuevoSaldo = round2(Number(card.saldo_actual) + delta);
  await sb.from('cards').update({saldo_actual: nuevoSaldo}).eq('id', cardId);
  if (checked){
    await sb.from('card_abonos').insert({card_id: cardId, monto: round2(monto), origen, fecha: hoy, direccion: sign>0?'suma':'resta', concepto});
  } else {
    await sb.from('card_abonos').delete().eq('card_id', cardId).eq('origen', origen);
  }

  // Cascada obligatoria: CUALQUIER abono que reduzca la deuda de una tarjeta de CRÉDITO
  // debe reflejarse también como salida de dinero en BAC (fuente de pagos), porque de ahí
  // sale físicamente el efectivo — sin excepción, sin importar si el rubro venía de
  // Quincenas, Tasa 0, Por Cobrar o un movimiento manual.
  if (kind === 'abono' && card.tipo_cuenta !== 'debito'){
    const fuente = state.cards.find(c => c.tipo_cuenta === 'debito' && c.es_fuente_pagos && c.id !== cardId);
    if (!fuente){
      toast('⚠ Se abonó a ' + card.nombre + ' pero ninguna tarjeta de débito está marcada como "fuente de pagos" — BAC no se ajustó. Corrígelo en ✎ Datos de tu tarjeta BAC.');
    } else {
      const fSign = cargoSign(fuente.tipo_cuenta);
      const fDelta = (checked ? 1 : -1) * fSign * Number(monto);
      const fNuevo = round2(Number(fuente.saldo_actual) + fDelta);
      await sb.from('cards').update({saldo_actual: fNuevo}).eq('id', fuente.id);
      const origenFuente = `fuente:${origen}`;
      if (checked){
        await sb.from('card_abonos').insert({card_id: fuente.id, monto: round2(monto), origen: origenFuente, fecha: hoy, direccion: fSign>0?'suma':'resta', concepto: concepto ? `Pago ${card.nombre}: ${concepto}` : `Pago tarjeta: ${card.nombre}`});
      } else {
        await sb.from('card_abonos').delete().eq('card_id', fuente.id).eq('origen', origenFuente);
      }
    }
  }
}

function openRubroModal(label){
  const cardOptions = state.cards.filter(c=>c.tipo_cuenta!=='debito').map(c=>`<option value="card:${c.id}">💳 ${c.nombre}</option>`).join('');

        <div class="field"><label>Tipo</label>
          <select name="tipo"><option value="variable">Variable</option><option value="fijo">Fijo</option><option value="ingreso">Ingreso</option></select>
        </div>
      </div>
      <div class="field" id="campoAplica" style="display:none;">
        <label>Este fijo se repite en...</label>
        <select name="aplica_a">
          <option value="ambas">Ambas quincenas de cada mes</option>
          <option value="primera">Solo la primera quincena (día 15)</option>
          <option value="segunda">Solo la segunda quincena (fin de mes)</option>
        </select>
      </div>
      <div class="field"><label>Vincular con tarjeta de crédito o Tasa 0 (opcional)</label>
        <select name="link"><option value="">Ninguno</option>${cardOptions}${deudaOptions}</select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="mCancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Agregar</button>
      </div>
    </form>
  `);
  document.getElementById('mCancel').onclick = closeModal;
  const tipoSel = document.querySelector('#f [name=tipo]');
  tipoSel.onchange = ()=>{
    document.getElementById('campoAplica').style.display = tipoSel.value==='fijo' ? 'block' : 'none';
  };
  document.getElementById('f').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    let link_type = null, link_id = null;
    const link = fd.get('link');
    if (link){ [link_type, link_id] = link.split(':'); }
    const nombre = fd.get('nombre'), monto = Number(fd.get('monto')), tipo = fd.get('tipo');

    let fijo_id = null;
    if (tipo==='fijo' && link_type!=='tasa0'){
      const aplica_a = fd.get('aplica_a') || 'ambas';
      const { data: tpl, error: eTpl } = await sb.from('rubros_fijos').insert({
        nombre, monto, link_type, link_id, last_generated_label: label, aplica_a
      }).select().single();
      if (!eTpl) fijo_id = tpl.id;
    }

    const { error } = await sb.from('rubros').insert({
      nombre, monto, tipo, quincena_label: label, link_type, link_id, fijo_id, orden: nextOrdenFor(label)
    });
    if (error) return toast('No se pudo guardar el rubro.');
    closeModal();
    await loadAll();
    toast(fijo_id ? 'Rubro fijo agregado — se repetirá en las próximas quincenas.' : 'Rubro agregado.', true);
  };
}

/* =========================================================
   TARJETAS
   ========================================================= */
function renderTarjetas(){
  const grid = document.getElementById('tarjetasGrid');
  grid.innerHTML = '';

  const ingresoActual = state.cards.filter(c=>c.tipo_cuenta==='debito').reduce((s,c)=>s+Number(c.saldo_actual),0);
  const deudaTotal = state.cards.filter(c=>c.tipo_cuenta!=='debito').reduce((s,c)=>s+Number(c.saldo_actual),0);
  const resumen = document.getElementById('tarjetasResumen');
  resumen.innerHTML = `
    <div class="resumen-item"><span>Ingreso actual (débito)</span><b style="color:var(--green)">${colones(ingresoActual)}</b></div>
    <div class="resumen-item"><span>Deuda total (crédito)</span><b style="color:var(--red)">${colones(deudaTotal)}</b></div>
  `;

  if (state.cards.length===0){
    grid.innerHTML = '<div class="empty">Aún no has agregado tarjetas.</div>';
    return;
  }
  state.cards.forEach(card=>{
    const esDebito = card.tipo_cuenta === 'debito';
    const movimientoNeto = round2(Number(card.saldo_actual) - Number(card.monto_inicial));
    // Para crédito, "Abonado" = cuánto se ha pagado de la deuda original (positivo = bien, pagó).
    // Para débito, "Movimiento neto" = cuánto más o menos dinero hay que al inicio.
    const abonado = -movimientoNeto; // monto_inicial - saldo_actual
    const cifraResumen = esDebito ? movimientoNeto : abonado;
    const abonos = state.cardAbonos.filter(a=>a.card_id===card.id).slice(0,6);
    const desdeUltima = state.cardAbonos.filter(a=>
      a.card_id===card.id && a.origen.startsWith('quincena') &&
      (!card.fecha_actualizacion || a.fecha > card.fecha_actualizacion)
    ).length;

    const el = document.createElement('div');
    el.innerHTML = `
      <div class="credit-card ${card.tipo}">
        <div class="top-row"><span>${card.nombre} ${esDebito?'· Débito':'· Crédito'}${card.es_fuente_pagos?' · 🏦 Fuente de pagos':''}</span><span class="digits">•••• ${card.ultimos_digitos||'----'}</span></div>
        <div><div class="balance">${colones(card.saldo_actual)}</div></div>
      </div>
      <div class="debt-card">
        <div class="desglose">
          <div>Monto inicial<b>${colones(card.monto_inicial)}</b></div>
          <div>${esDebito?'Movimiento neto':'Abonado'}<b style="color:${cifraResumen>=0?'var(--green)':'var(--red)'}">${cifraResumen>=0?'+':'-'}${colones(Math.abs(cifraResumen))}</b></div>
          <div>Saldo actual<b style="color:${esDebito?'var(--green)':'var(--red)'}">${colones(card.saldo_actual)}</b></div>
        </div>
        ${desdeUltima>0?`<div class="badge-sync">${desdeUltima} movimiento(s) aplicado(s) desde tu última actualización manual</div>`:''}
        <div class="abono-list">
          ${abonos.length? abonos.map(a=>{
            // La dirección real ya viene guardada en el movimiento (a.direccion). Si es un
            // movimiento antiguo sin ese campo, se aproxima por el tipo de origen (heurística).
            const signo = a.direccion ? (a.direccion==='suma'?1:-1)
                        : (a.origen.startsWith('quincena') || a.origen.startsWith('manual:') || a.origen==='ajuste' || a.origen.startsWith('porcobrar'))
                          ? accountSign(card.tipo_cuenta) : cargoSign(card.tipo_cuenta);
            const txt = a.concepto ? a.concepto
                      : a.origen.startsWith('fuente:quincena') ? `Pago tarjeta: ${quincenaOrigenLabel(a.origen.slice('fuente:'.length))}`
                      : a.origen.startsWith('fuente:') ? 'Pago tarjeta de crédito'
                      : a.origen.startsWith('quincena') ? quincenaOrigenLabel(a.origen)
                      : a.origen.startsWith('porcobrar') ? 'Abono de por cobrar'
                      : a.origen.startsWith('tasa0-cargo') ? 'Cargo inicial tasa 0'
                      : a.origen.startsWith('cargo-manual') ? 'Compra manual'
                      : a.origen.startsWith('manual') ? 'Movimiento manual' : 'Ajuste';
            return `<div class="line"><span>${txt} — ${a.fecha}</span><span>${signo>0?'+':'-'}${colones(a.monto)}</span></div>`;
          }).join('') : '<div class="line"><span>Sin movimientos registrados</span></div>'}
        </div>
        <div class="card-actions">
          <button class="btn btn-sm" data-editinfo="${card.id}">✎ Datos</button>
          <button class="btn btn-sm" data-editcard="${card.id}">Actualizar saldo</button>
          <button class="btn btn-sm" data-abonocard="${card.id}">+ Movimiento manual</button>
          <button class="btn btn-sm btn-danger" data-delcard="${card.id}">Eliminar</button>
        </div>
      </div>
    `;
    grid.appendChild(el);
  });

  grid.querySelectorAll('[data-editinfo]').forEach(b=> b.onclick = ()=> openEditCardInfoModal(b.dataset.editinfo));
  grid.querySelectorAll('[data-editcard]').forEach(b=> b.onclick = ()=> openEditCardModal(b.dataset.editcard));
  grid.querySelectorAll('[data-abonocard]').forEach(b=> b.onclick = ()=> openAbonoCardModal(b.dataset.abonocard));
  grid.querySelectorAll('[data-delcard]').forEach(b=> b.onclick = async ()=>{
    const { error } = await sb.from('cards').delete().eq('id', b.dataset.delcard);
    if (error) return toast('No se pudo eliminar.');
    await loadAll();
  });
}

function openEditCardModal(id){

          <option value="si">Sí, ya los incluye — dejar el monto tal cual</option>

/* =========================================================
   TASA 0
   ========================================================= */
function shortDate(isoStr){
  const [y,m,d] = isoStr.split('-').map(Number);
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d}-${meses[m-1]}`;
}
function shortDateSlash(isoStr){
  const [y,m,d] = isoStr.split('-').map(Number);
  return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}`;
}
// Convierte una etiqueta de origen ("quincena:2026-09-15:rubroId") en un texto legible,
// usando el nombre del rubro que la generó cuando aún existe.
function quincenaOrigenLabel(tag){
  const parts = tag.split(':'); // ['quincena', 'YYYY-MM-DD', rubroId?]
  const label = parts[1], rubroId = parts[2];
  const rubroRef = rubroId ? state.rubros.find(r=>r.id===rubroId) : null;
  return rubroRef ? `${rubroRef.nombre} — ${shortDateSlash(label)}` : `Quincena ${labelDisplay(label)}`;
}
function tasa0Rows(deuda){
  const pagosMap = {};
  state.tasa0Pagos.filter(p=>p.deuda_id===deuda.id).forEach(p=>{ pagosMap[p.quincena_label] = p.pagado; });
  const rows = [];
  for (let i=0; i<deuda.num_cuotas; i++){
    const cobro = addMonths(deuda.fecha_inicio, i);
    const [y,m] = cobro.split('-').map(Number);
    const q1 = iso(y, m-1, 15);
    const q2 = iso(y, m-1, lastDayOfMonth(y, m-1));
    rows.push({
      n: i+1, fechaLabel: shortDate(cobro), monto: Number(deuda.monto_cuota),
      q1, q2, q1paid: !!pagosMap[q1], q2paid: !!pagosMap[q2],
    });
  }
  return rows;
}
function renderTasa0(){
  const grid = document.getElementById('tasa0Grid');
  grid.innerHTML = '';
  if (state.deudas.length===0){
    grid.innerHTML = '<div class="empty">No hay deudas a tasa 0 registradas.</div>';
    return;
  }
  state.deudas.forEach(d=>{
    const rows = tasa0Rows(d);
    const pagadoMonto = rows.reduce((s,r)=> s + (r.q1paid? r.monto/2:0) + (r.q2paid? r.monto/2:0), 0);
    const total = d.monto_total!=null ? Number(d.monto_total) : rows.reduce((s,r)=>s+r.monto,0);
    const pendiente = total - pagadoMonto;
    const totalQ = d.num_cuotas*2;
    const pagadasQ = rows.reduce((s,r)=> s+(r.q1paid?1:0)+(r.q2paid?1:0), 0);
    const pct = totalQ ? Math.round((pagadasQ/totalQ)*100) : 0;
    const actualIdx = rows.findIndex(r=> !(r.q1paid && r.q2paid));
    const cuotaActual = actualIdx===-1 ? d.num_cuotas : actualIdx+1;
    const proxima = actualIdx===-1 ? 'Completado' : rows[actualIdx].fechaLabel;

    const el = document.createElement('div');
    el.className = 'debt-card';
    const cardVinculada = d.card_id ? state.cards.find(c=>c.id===d.card_id) : null;
    el.innerHTML = `
      <div class="debt-head">
        <div class="debt-name">${d.concepto}</div>
        <button class="icon-btn" data-editdeuda="${d.id}" title="Editar">✎</button>
      </div>
      <div class="badges">
        <span class="badge">${colones(d.monto_cuota)} / mes</span>
        <span class="badge">Cuota ${cuotaActual}/${d.num_cuotas}</span>
        <span class="badge">Próxima: ${proxima}</span>
        ${cardVinculada?`<span class="badge">💳 ${cardVinculada.nombre}</span>`:''}
      </div>
      <div class="stats-row">
        <div>Pagado<b style="color:var(--green)">${colones(pagadoMonto)}</b></div>
        <div>Pendiente<b style="color:var(--red)">${colones(pendiente)}</b></div>
        <div>Total<b>${colones(total)}</b></div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="cuotas-table-wrap">
        <table class="cuotas-table">
          <thead><tr><th>#</th><th>Fecha</th><th>Monto</th><th>1ª</th><th>2ª</th></tr></thead>
          <tbody>
            ${rows.map(r=>`
              <tr class="${r.q1paid && r.q2paid ? 'done' : ''}">
                <td>#${r.n}</td>
                <td>${r.fechaLabel}</td>
                <td>${colones(r.monto)}</td>
                <td><input type="checkbox" disabled title="Se marca desde Quincenas" ${r.q1paid?'checked':''}></td>
                <td><input type="checkbox" disabled title="Se marca desde Quincenas" ${r.q2paid?'checked':''}></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="card-actions">
        <button class="btn btn-sm btn-danger" data-deldeuda="${d.id}">Eliminar</button>
      </div>
    `;
    grid.appendChild(el);
  });
  grid.querySelectorAll('[data-deldeuda]').forEach(b=> b.onclick = async ()=>{
    if (!confirm('Esto eliminará también sus rubros en Quincenas. ¿Continuar?')) return;
    await sb.from('rubros').delete().eq('link_type','tasa0').eq('link_id', b.dataset.deldeuda);
    await sb.from('deudas_tasa0').delete().eq('id', b.dataset.deldeuda);
    await loadAll();
  });
  grid.querySelectorAll('[data-editdeuda]').forEach(b=> b.onclick = ()=> openEditDeudaModal(b.dataset.editdeuda));
}

        <select name="card_id"><option value="">Ninguna — se paga aparte</option>${cardOptions}</select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="mCancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear</button>
      </div>
    </form>
  `);
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('f').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const monto = Number(fd.get('monto')), meses = Number(fd.get('meses'));
    const fechaInicio = fd.get('fecha');
    const diaCobro = Number(fechaInicio.split('-')[2]);
    const montoCuota = round2(monto / meses);
    const cardId = fd.get('card_id') || null;

    const { data: deuda, error } = await sb.from('deudas_tasa0').insert({
      concepto: fd.get('concepto'), monto_total: monto, num_cuotas: meses,
      monto_cuota: montoCuota, dia_cobro: diaCobro, fecha_inicio: fechaInicio, card_id: cardId
    }).select().single();
    if (error) return toast('No se pudo crear el préstamo.');

    const rubrosNuevos = [], pagosNuevos = [];
    for (let i=0; i<meses; i++){
      const cobroDate = addMonths(fechaInicio, i);
      const [y,m] = cobroDate.split('-').map(Number);
      const q1 = iso(y, m-1, 15);
      const q2 = iso(y, m-1, lastDayOfMonth(y, m-1));
      [q1, q2].forEach(label=>{
        rubrosNuevos.push({ nombre: fd.get('concepto'), monto: round2(montoCuota/2), tipo:'fijo', quincena_label: label, link_type:'tasa0', link_id: deuda.id, orden: nextOrdenFor(label) });
        pagosNuevos.push({ deuda_id: deuda.id, quincena_label: label, pagado:false });
      });
    }
    await sb.from('rubros').insert(rubrosNuevos);
    await sb.from('tasa0_pagos').insert(pagosNuevos);
    if (cardId){
      const card = state.cards.find(c=>c.id===cardId);
      if (card){
        const sign = cargoSign(card.tipo_cuenta);
        await sb.from('cards').update({saldo_actual: round2(Number(card.saldo_actual) + sign*monto)}).eq('id', cardId);
        await sb.from('card_abonos').insert({card_id: cardId, monto, origen: `tasa0-cargo:${deuda.id}`, fecha: fechaInicio, direccion: sign>0?'suma':'resta'});
      }
    }
    closeModal(); await loadAll(); toast('Préstamo creado y calendario generado.', true);
  };
};

/* =========================================================
   POR COBRAR
   ========================================================= */
function renderPorCobrar(){
  const box = document.getElementById('porCobrarList');
  box.innerHTML = '';
  const btnNuevo = document.getElementById('btnNuevoCobrar');

  if (!state.porCobrarPersona){
    // Vista agrupada: una fila por persona.
    btnNuevo.textContent = '+ Nuevo';
    if (state.porCobrar.length===0){
      box.innerHTML = '<div class="empty">No hay préstamos a terceros registrados.</div>';
      return;
    }
    const grupos = {};
    state.porCobrar.forEach(p=>{
      const key = p.persona.trim();
      (grupos[key] ??= []).push(p);
    });
    Object.keys(grupos).sort((a,b)=>a.localeCompare(b)).forEach(persona=>{
      const prestamos = grupos[persona];
      let totalPendiente = 0;
      prestamos.forEach(p=>{
        const abonado = state.porCobrarAbonos.filter(a=>a.cobrar_id===p.id).reduce((s,a)=>s+Number(a.monto),0);
        totalPendiente += Number(p.monto_total) - abonado;
      });
      const el = document.createElement('div');
      el.className = 'block persona-row';
      el.innerHTML = `
        <div class="block-head">
          <div><div class="persona-name">${persona}</div><div class="sub">${prestamos.length} préstamo${prestamos.length>1?'s':''}</div></div>
          <div style="text-align:right;">
            <div class="block-total">Saldo: <b style="color:${totalPendiente>0?'var(--red)':'var(--green)'}">${colones(totalPendiente)}</b></div>
          </div>
        </div>
      `;
      el.onclick = ()=>{ state.porCobrarPersona = persona; renderPorCobrar(); };
      box.appendChild(el);
    });
    return;
  }

  // Vista detalle: préstamos de una persona en particular.
  btnNuevo.textContent = `+ Nuevo préstamo a ${state.porCobrarPersona}`;
  const header = document.createElement('div');
  header.innerHTML = `
    <button class="btn btn-sm btn-ghost" id="btnVolverPersonas">← Todas las personas</button>
    <div class="persona-name" style="margin:12px 0 14px;font-size:22px;">${state.porCobrarPersona}</div>
  `;
  box.appendChild(header);
  document.getElementById('btnVolverPersonas').onclick = ()=>{ state.porCobrarPersona = null; renderPorCobrar(); };

  const prestamos = state.porCobrar.filter(p=>p.persona.trim()===state.porCobrarPersona);
  if (prestamos.length===0){
    box.innerHTML += '<div class="empty">Esta persona ya no tiene préstamos registrados.</div>';
  }
  prestamos.forEach(p=>{
    const abonos = state.porCobrarAbonos.filter(a=>a.cobrar_id===p.id).slice().sort((a,b)=> b.fecha.localeCompare(a.fecha));
    const abonado = abonos.reduce((s,a)=>s+Number(a.monto),0);
    const saldo = Number(p.monto_total) - abonado;
    const cardVinculada = p.card_id ? state.cards.find(c=>c.id===p.card_id) : null;
    const rubroVinculado = state.rubros.find(r=>r.link_type==='porcobrar' && r.link_id===p.id);
    let vinculoTxt = '';
    if (cardVinculada) vinculoTxt = `💳 Cargado en ${cardVinculada.nombre}`;
    else if (rubroVinculado) vinculoTxt = `📅 ${rubroVinculado.pagado ? 'Cobrado' : 'Espera cobro'}: ${labelDisplay(rubroVinculado.quincena_label)}`;
    const origenTxt = o => o==='manual' ? 'Abono manual' : o.startsWith('quincena') ? `Quincena ${labelDisplay(o.split(':')[1])}` : 'Abono';
    const el = document.createElement('div');
    el.className = 'block';
    el.innerHTML = `
      <div class="block-head">
        <div><div class="label">${p.concepto||'Préstamo'}</div><div class="sub">${vinculoTxt||'Sin vínculo'}</div></div>
        <div style="text-align:right;">
          <div class="block-total">Saldo: <b style="color:${saldo>0?'var(--red)':'var(--green)'}">${colones(saldo)}</b></div>
        </div>
      </div>
      <details class="abono-details">
        <summary>Ver abonos (${abonos.length})</summary>
        <div class="abono-list">
          ${abonos.length? abonos.map(a=>`<div class="line"><span>${origenTxt(a.origen)} — ${a.fecha}</span><span>${colones(a.monto)}</span></div>`).join('') : '<div class="line"><span>Sin abonos registrados</span></div>'}
        </div>
      </details>
      <div class="card-actions">
        <button class="btn btn-sm" data-abonocobrar="${p.id}">+ Registrar abono</button>
        <button class="btn btn-sm btn-danger" data-delcobrar="${p.id}">Eliminar</button>
      </div>
    `;
    box.appendChild(el);
  });
  box.querySelectorAll('[data-abonocobrar]').forEach(b=> b.onclick = ()=> openAbonoCobrarModal(b.dataset.abonocobrar));
  box.querySelectorAll('[data-delcobrar]').forEach(b=> b.onclick = async ()=>{
    await sb.from('rubros').delete().eq('link_type','porcobrar').eq('link_id', b.dataset.delcobrar);
    await sb.from('por_cobrar').delete().eq('id', b.dataset.delcobrar);
    await loadAll();
  });
}

document.getElementById('btnNuevoCobrar').onclick = ()=>{
  const cardOptions = state.cards.map(c=>`<option value="${c.id}">${c.nombre} (${c.tipo_cuenta==='debito'?'Débito':'Crédito'})</option>`).join('');
  openModal(`
    <h3>Nuevo préstamo a tercero</h3>
    <form id="f">
      <div class="field"><label>Persona</label><input name="persona" value="${state.porCobrarPersona||''}" required autofocus></div>
      <div class="field"><label>Concepto (opcional)</label><input name="concepto"></div>
      <div class="field"><label>Monto (₡)</label><input name="monto" type="number" step="0.01" required></div>
      <div class="field"><label>Vínculo (opcional)</label>
        <select name="vinculo">
          <option value="">Ninguno</option>
          <option value="card">Se cargó a una tarjeta mía</option>
          <option value="quincena">Espero que me paguen en una quincena</option>
        </select>
      </div>
      <div class="field" id="campoTarjeta" style="display:none;">
        <label>Tarjeta</label>
        <select name="card_id">${cardOptions}</select>
      </div>
      <div class="field" id="campoFecha" style="display:none;">
        <label>Fecha esperada de cobro</label>
        <input name="fecha_esperada" type="date">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="mCancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear</button>
      </div>
    </form>
  `);
  document.getElementById('mCancel').onclick = closeModal;
  const vinculoSel = document.querySelector('#f [name=vinculo]');
  vinculoSel.onchange = ()=>{
    document.getElementById('campoTarjeta').style.display = vinculoSel.value==='card' ? 'block' : 'none';
    document.getElementById('campoFecha').style.display = vinculoSel.value==='quincena' ? 'block' : 'none';
  };
  document.getElementById('f').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const monto = Number(fd.get('monto'));
    const vinculo = fd.get('vinculo');
    const cardId = vinculo==='card' ? (fd.get('card_id') || null) : null;

    const { data: cobrar, error } = await sb.from('por_cobrar').insert({
      persona: fd.get('persona'), concepto: fd.get('concepto'), monto_total: monto, card_id: cardId
    }).select().single();
    if (error) return toast('No se pudo crear.');

    if (vinculo==='quincena' && fd.get('fecha_esperada')){
      const fecha = new Date(fd.get('fecha_esperada') + 'T00:00:00');
      const label = quincenaOf(fecha);
      await sb.from('rubros').insert({
        nombre: fd.get('persona'), monto, tipo:'ingreso', quincena_label: label,
        link_type:'porcobrar', link_id: cobrar.id, orden: nextOrdenFor(label)
      });
    }
    closeModal(); await loadAll(); toast('Registrado.', true);
  };
};

function openAbonoCobrarModal(id){
  const p = state.porCobrar.find(x=>x.id===id);
  openModal(`
    <h3>Registrar abono</h3>
    ${p && p.card_id ? '<p style="font-size:11.5px;color:var(--muted);margin-top:-6px;">Este préstamo está cargado a una tarjeta: el abono también restará de su saldo.</p>' : ''}
    <form id="f">
      <div class="field"><label>Monto (₡)</label><input name="monto" type="number" step="0.01" required autofocus></div>
      <div class="field"><label>Fecha</label><input name="fecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="mCancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Registrar</button>
      </div>
    </form>
  `);
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('f').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const monto = Number(fd.get('monto'));
    const fecha = fd.get('fecha');
    const { error } = await sb.from('por_cobrar_abonos').insert({
      cobrar_id: id, monto, fecha, origen: 'manual'
    });
    if (error) return toast('No se pudo registrar.');
    if (p && p.card_id){
      const card = state.cards.find(c=>c.id===p.card_id);
      if (card){
        const sign = accountSign(card.tipo_cuenta);
        await sb.from('cards').update({saldo_actual: round2(Number(card.saldo_actual) + sign*monto)}).eq('id', card.id);
        await sb.from('card_abonos').insert({card_id: card.id, monto, origen: `porcobrar:${id}:${Date.now()}`, fecha, direccion: sign>0?'suma':'resta'});
      }
    }
    closeModal(); await loadAll(); toast('Abono registrado.', true);
  };
}

/* =========================================================
   MODAL / NAV / INIT
   ========================================================= */
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').style.display = 'flex';
}
function closeModal(){ document.getElementById('modalBg').style.display = 'none'; }
document.getElementById('modalBg').addEventListener('click', (e)=>{
  if (e.target.id === 'modalBg') closeModal();
});

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
  };
});

document.getElementById('btnMesPrev').onclick = ()=>{
  state.viewMonth--; if (state.viewMonth<0){ state.viewMonth=11; state.viewYear--; }
  renderQuincenas();
};
document.getElementById('btnMesNext').onclick = ()=>{
  state.viewMonth++; if (state.viewMonth>11){ state.viewMonth=0; state.viewYear++; }
  renderQuincenas();
};
document.getElementById('btnMesHoy').onclick = ()=>{
  const hoy = new Date();
  state.viewYear = hoy.getFullYear(); state.viewMonth = hoy.getMonth();
  renderQuincenas();
};

loadAll();

</script>
</body>
</html>
